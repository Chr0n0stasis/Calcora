name: Build iOS

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Unsigned iOS IPA
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare build tools
        run: |
          chmod +x gradlew iosApp/native/build-native.sh
          xcodebuild -version
          cmake --version
          java -version

      - name: Build unsigned iOS device app
        run: |
          set -o pipefail
          xcodebuild \
            -project iosApp/CalcoraIOS.xcodeproj \
            -target CalcoraIOS \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            SYMROOT="$RUNNER_TEMP/ios-build" \
            OBJROOT="$RUNNER_TEMP/ios-obj" \
            clean build

      - name: Package unsigned IPA
        run: |
          APP_PATH="$(find "$RUNNER_TEMP/ios-build" -path "*/Release-iphoneos/CalcoraIOS.app" -type d -print -quit)"
          test -n "$APP_PATH"
          IPA_ROOT="$RUNNER_TEMP/ipa"
          mkdir -p "$IPA_ROOT/Payload"
          ditto "$APP_PATH" "$IPA_ROOT/Payload/CalcoraIOS.app"
          (cd "$IPA_ROOT" && zip -qry "$RUNNER_TEMP/Calcora-unsigned.ipa" Payload)
          unzip -t "$RUNNER_TEMP/Calcora-unsigned.ipa"
          unzip -Z1 "$RUNNER_TEMP/Calcora-unsigned.ipa" \
            | grep -q '^Payload/CalcoraIOS.app/Info.plist$'

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Calcora-unsigned-IPA
          path: ${{ runner.temp }}/Calcora-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
